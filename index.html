<script>

/* =====================================================
   LAHCEN AI FOOTBALL ENGINE
   API-FOOTBALL V3
===================================================== */

const API_BASE =
 "https://v3.football.api-sports.io";

const cache = new Map();


/* =====================================================
   START
===================================================== */

document.addEventListener("DOMContentLoaded",()=>{

 const saved =
  localStorage.getItem("football_api_key");

 if(saved){
  document.getElementById("api-key").value=saved;
 }

 const today =
  new Intl.DateTimeFormat("en-CA",{
   timeZone:"Africa/Casablanca",
   year:"numeric",
   month:"2-digit",
   day:"2-digit"
  }).format(new Date());

 document.getElementById("selected-date").value=today;

 if(
  localStorage.getItem("lahcen_logged")==="true"
 ){
  showMain();
 }

});


/* =====================================================
   LOGIN
===================================================== */

function login(){

 const user =
  document.getElementById("user-input")
  .value.trim().toLowerCase();

 const pass =
  document.getElementById("pass-input")
  .value.trim().toLowerCase();

 if(user==="lahcen" && pass==="lahcen"){

  localStorage.setItem(
   "lahcen_logged",
   "true"
  );

  showMain();

 }else{

  alert("بيانات الدخول غير صحيحة");

 }

}


function logout(){

 localStorage.removeItem("lahcen_logged");

 document.getElementById("dashboard")
  .style.display="none";

 document.getElementById("login-box")
  .style.display="flex";

}


function showMain(){

 document.getElementById("login-box")
  .style.display="none";

 document.getElementById("dashboard")
  .style.display="block";

}


function saveApiKey(){

 localStorage.setItem(
  "football_api_key",
  document.getElementById("api-key")
   .value.trim()
 );

}


/* =====================================================
   API REQUEST
===================================================== */

async function api(endpoint,headers){

 const response =
  await fetch(
   API_BASE+endpoint,
   {
    method:"GET",
    headers
   }
  );

 if(!response.ok){

  throw new Error(
   "HTTP "+response.status
  );

 }

 const data =
  await response.json();

 if(
  data.errors &&
  Object.keys(data.errors).length
 ){

  throw new Error(
   Object.values(data.errors).join(" | ")
  );

 }

 return data.response || [];

}


/* =====================================================
   CACHE
===================================================== */

async function cached(endpoint,headers){

 if(cache.has(endpoint)){
  return cache.get(endpoint);
 }

 const data =
  await api(endpoint,headers);

 cache.set(endpoint,data);

 return data;

}


/* =====================================================
   TIME
===================================================== */

function moroccoTime(date){

 return new Date(date).toLocaleTimeString(
  "fr-FR",
  {
   timeZone:"Africa/Casablanca",
   hour:"2-digit",
   minute:"2-digit",
   hour12:false
  }
 );

}


/* =====================================================
   DATE
===================================================== */

function dateMorocco(date){

 return new Date(date).toLocaleDateString(
  "fr-FR",
  {
   timeZone:"Africa/Casablanca",
   day:"2-digit",
   month:"2-digit",
   year:"numeric"
  }
 );

}


/* =====================================================
   NUMBER HELPERS
===================================================== */

function num(value){

 const n=parseFloat(value);

 return Number.isFinite(n)?n:0;

}


function clamp(v,min,max){

 return Math.max(min,Math.min(max,v));

}


function pct(v){

 return Math.round(
  clamp(v,0,99)
 )+"%";

}


/* =====================================================
   FORM SCORE
===================================================== */

function calculateForm(form){

 if(!form){
  return 50;
 }

 const letters =
  form
   .toUpperCase()
   .split("")
   .filter(x=>["W","D","L"].includes(x));

 if(!letters.length){
  return 50;
 }

 let score=50;

 letters.forEach(x=>{

  if(x==="W") score+=8;
  if(x==="D") score+=2;
  if(x==="L") score-=7;

 });

 return clamp(score,15,85);

}


/* =====================================================
   POISSON
===================================================== */

function factorial(n){

 let r=1;

 for(let i=2;i<=n;i++){
  r*=i;
 }

 return r;

}


function poisson(lambda,k){

 return (
  Math.exp(-lambda) *
  Math.pow(lambda,k) /
  factorial(k)
 );

}


/* =====================================================
   MATRIX
===================================================== */

function createMatrix(homeLambda,awayLambda){

 const matrix=[];

 for(let home=0;home<=7;home++){

  for(let away=0;away<=7;away++){

   const probability =
    poisson(homeLambda,home) *
    poisson(awayLambda,away);

   matrix.push({
    home,
    away,
    probability
   });

  }

 }

 return matrix;

}


/* =====================================================
   TEAM STATISTICS EXTRACTION
===================================================== */

function extractGoals(stats){

 if(!stats){

  return {
   scored:1.2,
   conceded:1.2
  };

 }

 let scored=1.2;
 let conceded=1.2;


 try{

  const totalFor =
   stats.goals?.for?.total;

  const totalAgainst =
   stats.goals?.against?.total;


  if(totalFor){

   scored =
    num(
     totalFor.total ||
     totalFor.home ||
     totalFor.away
    );

  }


  if(totalAgainst){

   conceded =
    num(
     totalAgainst.total ||
     totalAgainst.home ||
     totalAgainst.away
    );

  }

 }catch(e){}


 return {
  scored:scored || 1.2,
  conceded:conceded || 1.2
 };

}


/* =====================================================
   ADVANCED PREDICTION
===================================================== */

function buildPrediction(data){

 const homeGoals =
  extractGoals(data.homeStats);

 const awayGoals =
  extractGoals(data.awayStats);


 /*
  Attack + opponent defence
 */

 let homeLambda =
  homeGoals.scored*0.55 +
  awayGoals.conceded*0.45;

 let awayLambda =
  awayGoals.scored*0.55 +
  homeGoals.conceded*0.45;


 /*
  Home advantage
 */

 homeLambda*=1.08;


 /*
  FORM
 */

 const homeForm =
  calculateForm(data.homeStats?.form);

 const awayForm =
  calculateForm(data.awayStats?.form);

 const formDifference =
  (homeForm-awayForm)/100;


 homeLambda *=
  1+(formDifference*.18);

 awayLambda *=
  1-(formDifference*.18);


 /*
  Injuries adjustment
 */

 const homeInjuries =
  data.homeInjuries.length;

 const awayInjuries =
  data.awayInjuries.length;


 if(homeInjuries>=4){
  homeLambda*=0.95;
 }

 if(awayInjuries>=4){
  awayLambda*=0.95;
 }


 homeLambda=
  clamp(homeLambda,.15,4);

 awayLambda=
  clamp(awayLambda,.15,4);


 const matrix =
  createMatrix(
   homeLambda,
   awayLambda
  );


 let homeWin=0;
 let draw=0;
 let awayWin=0;

 let over15=0;
 let over25=0;
 let over35=0;

 let btts=0;


 matrix.forEach(x=>{

  if(x.home>x.away){
   homeWin+=x.probability;
  }

  if(x.home===x.away){
   draw+=x.probability;
  }

  if(x.home<x.away){
   awayWin+=x.probability;
  }

  const total =
   x.home+x.away;

  if(total>=2){
   over15+=x.probability;
  }

  if(total>=3){
   over25+=x.probability;
  }

  if(total>=4){
   over35+=x.probability;
  }

  if(
   x.home>0 &&
   x.away>0
  ){
   btts+=x.probability;
  }

 });


 homeWin*=100;
 draw*=100;
 awayWin*=100;

 over15*=100;
 over25*=100;
 over35*=100;

 btts*=100;


 const under15=
  100-over15;

 const under25=
  100-over25;

 const under35=
  100-over35;

 const noBtts=
  100-btts;


 const double1X =
  homeWin+draw;

 const doubleX2 =
  draw+awayWin;

 const double12 =
  homeWin+awayWin;


 /*
  Exact scores
 */

 const exact =
  [...matrix]
   .sort(
    (a,b)=>
     b.probability-a.probability
   )
   .slice(0,8)
   .map(x=>({

    score:
     `${x.home}-${x.away}`,

    probability:
     x.probability*100

   }));


 /*
  Main candidates
 */

 const candidates=[

  {
   name:"1X",
   probability:double1X
  },

  {
   name:"X2",
   probability:doubleX2
  },

  {
   name:"12",
   probability:double12
  },

  {
   name:"Over 1.5",
   probability:over15
  },

  {
   name:"Under 2.5",
   probability:under25
  },

  {
   name:"BTTS",
   probability:btts
  },

  {
   name:"NO BTTS",
   probability:noBtts
  },

  {
   name:"1",
   probability:homeWin
  },

  {
   name:"X",
   probability:draw
  },

  {
   name:"2",
   probability:awayWin
  }

 ];


 /*
  API prediction signal
 */

 if(
  data.apiPrediction &&
  data.apiPrediction.predictions
 ){

  const p =
   data.apiPrediction.predictions;

  if(
   p.winner &&
   p.winner.name
  ){

   const winnerName =
    p.winner.name;

   const isHome =
    winnerName === data.homeName;

   const isAway =
    winnerName === data.awayName;


   if(isHome){

    homeWin =
     homeWin*0.75+25;

   }

   if(isAway){

    awayWin =
     awayWin*0.75+25;

   }

  }

 }


 candidates.sort(
  (a,b)=>
   b.probability-a.probability
 );


 const best=candidates[0];


 /*
  Data quality
 */

 let dataScore=0;

 if(data.homeStats) dataScore+=15;
 if(data.awayStats) dataScore+=15;
 if(data.h2h.length) dataScore+=10;
 if(data.homeInjuries) dataScore+=10;
 if(data.awayInjuries) dataScore+=10;
 if(data.apiPrediction) dataScore+=15;
 if(data.standings) dataScore+=10;
 if(data.lineups) dataScore+=15;


 /*
  Confidence is NOT fake accuracy.
 */

 let confidence =
  best.probability*0.75 +
  dataScore*0.25;


 confidence=
  clamp(confidence,0,99);


 return{

  homeLambda,
  awayLambda,

  homeWin,
  draw,
  awayWin,

  double1X,
  doubleX2,
  double12,

  over15,
  under15,

  over25,
  under25,

  over35,
  under35,

  btts,
  noBtts,

  exact,

  best,

  confidence,

  dataScore,

  homeForm,
  awayForm,

  homeInjuries,
  awayInjuries

 };

}

/* =====================================================
   ANALYZE MATCH
===================================================== */

async function analyzeMatch(
 button,
 fixture
){

 const key =
  document.getElementById("api-key")
   .value.trim();

 if(!key){

  alert("دخل API-Football Key أولاً");

  return;

 }


 const card =
  document.getElementById(
   "match-"+fixture.fixture.id
  );

 const analysis =
  card.querySelector(".analysis");

 const buttonText =
  button.innerHTML;


 button.disabled=true;

 button.innerHTML=
  "🧠 جاري التحليل...";


 analysis.style.display="block";

 analysis.innerHTML=`

  <div class="loading" style="display:block">

   🧠 جمع البيانات:

   <br><br>

   Form • H2H • Injuries • Standings
   <br>
   Predictions • Lineups • Statistics
   <br><br>

   ⏳ المرجو الانتظار...

  </div>

 `;


 const headers={
  "x-apisports-key":key
 };


 const homeId=
  fixture.teams.home.id;

 const awayId=
  fixture.teams.away.id;

 const leagueId=
  fixture.league.id;

 const season=
  fixture.league.season;

 const fixtureId=
  fixture.fixture.id;


 try{

  /*
   Automatic data collection
  */

  const results =
   await Promise.all([

    getTeamStats(
     homeId,
     leagueId,
     season,
     headers
    ),

    getTeamStats(
     awayId,
     leagueId,
     season,
     headers
    ),

    getH2H(
     homeId,
     awayId,
     headers
    ),

    getInjuries(
     homeId,
     season,
     headers
    ),

    getInjuries(
     awayId,
     season,
     headers
    ),

    getStandings(
     leagueId,
     season,
     headers
    ),

    getPrediction(
     fixtureId,
     headers
    ),

    getLineups(
     fixtureId,
     headers
    ),

    getFixtureStats(
     fixtureId,
     headers
    )

  ]);


  const data={

   homeStats:results[0],

   awayStats:results[1],

   h2h:results[2],

   homeInjuries:results[3],

   awayInjuries:results[4],

   standings:results[5],

   apiPrediction:results[6],

   lineups:
    results[7].length
     ? results[7]
     : null,

   fixtureStats:results[8],

   homeName:
    fixture.teams.home.name,

   awayName:
    fixture.teams.away.name

  };


  const prediction =
   buildPrediction(data);


  analysis.innerHTML =
   renderAnalysis(
    fixture,
    prediction,
    data
   );


  button.innerHTML=
   "✓ ANALYZED";


 }catch(error){

  analysis.innerHTML=`

   <div class="info error">

    ❌ تعذر إكمال التحليل

    <br><br>

    ${escapeHtml(error.message)}

   </div>

  `;

  button.innerHTML=buttonText;

 }finally{

  button.disabled=false;

 }

}

/* =====================================================
   LOAD FIXTURES
===================================================== */

async function loadFixtures(){

 const key =
  document.getElementById("api-key")
   .value.trim();

 const date =
  document.getElementById("selected-date")
   .value;

 const result =
  document.getElementById("result-box");

 const loading =
  document.getElementById("loading");


 if(!key){

  alert("دخل API-Football Key أولاً");

  return;

 }


 if(!date){

  alert("اختار التاريخ");

  return;

 }


 localStorage.setItem(
  "football_api_key",
  key
 );


 result.innerHTML="";

 loading.style.display="block";


 const headers={
  "x-apisports-key":key
 };


 try{

  const fixtures =
   await api(
    `/fixtures?date=${date}&timezone=Africa/Casablanca`,
    headers
   );


  loading.style.display="none";


  if(!fixtures.length){

   result.innerHTML=`

    <div class="panel status">

     ⚽ ما كايناش مباريات فهاد التاريخ.

    </div>

   `;

   return;

  }


  const grouped={};


  fixtures.forEach(f=>{

   const leagueName =
    `${f.league.country} - ${f.league.name}`;

   if(!grouped[leagueName]){
    grouped[leagueName]=[];
   }

   grouped[leagueName].push(f);

  });


  const leagues =
   Object.keys(grouped)
    .sort((a,b)=>a.localeCompare(b));


  let html=`

   <div class="panel">

    <div class="status">

     🏆 ${leagues.length} بطولة

     • ⚽ ${fixtures.length} مباراة

     <br><br>

     اختار المباراة واضغط
     <b>ANALYZE MATCH</b>
     للحصول على التحليل العميق.

    </div>

   </div>

  `;


  let index=0;


  leagues.forEach(leagueName=>{

   index++;


   html+=`

    <div class="league">

     <button
      class="league-head"
      onclick="toggleLeague(${index})">

      <span class="league-name">

       🏆 ${escapeHtml(leagueName)}

      </span>

      <span class="count">

       ${grouped[leagueName].length}

      </span>

     </button>


     <div
      id="league-${index}"
      class="league-content">

   `;


   grouped[leagueName].forEach(f=>{

    const fixtureId =
     f.fixture.id;


    const status =
     f.fixture.status.short;


    const scheduled =
     ["NS","TBD"].includes(status);


    html+=`

     <div
      class="match"
      id="match-${fixtureId}">


      <div class="match-top">

       <span class="time">

        ⏰
        ${moroccoTime(f.fixture.date)}
        🇲🇦

       </span>

       <span class="status-live">

        ${scheduled
         ?"● UPCOMING"
         :"● "+escapeHtml(status)}

       </span>

      </div>


      <div class="teams">

       <div class="team">

        ${escapeHtml(
         f.teams.home.name
        )}

       </div>


       <div class="vs">

        VS

       </div>


       <div class="team">

        ${escapeHtml(
         f.teams.away.name
        )}

       </div>

      </div>


      <button
       class="analyze"
       onclick='analyzeMatch(this,${JSON.stringify(f).replace(/'/g,"&#39;")})'
       ${scheduled?"":"disabled"}>

       ${
        scheduled
         ?"🧠 ANALYZE MATCH"
         :"⛔ MATCH NOT UPCOMING"
       }

      </button>


      <div class="analysis"></div>


     </div>

    `;

   });


   html+=`

     </div>

    </div>

   `;

  });


  result.innerHTML=html;


 }catch(error){

  loading.style.display="none";


  result.innerHTML=`

   <div class="panel status error">

    ❌ API ERROR

    <br><br>

    ${escapeHtml(error.message)}

   </div>

  `;

 }

}


/* =====================================================
   ACCORDION
===================================================== */

function toggleLeague(id){

 const el =
  document.getElementById(
   "league-"+id
  );

 if(!el)return;

 el.style.display =
  el.style.display==="block"
   ?"none"
   :"block";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}
