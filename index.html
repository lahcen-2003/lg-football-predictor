<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Sports Predictor VIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: #07090e; color: #fff; padding: 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; text-align: center; }
    
    .header { background: #111827; border: 1px solid #f59e0b; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(245,158,11,0.2); }
    .header h1 { color: #f59e0b; font-size: 20px; }
    
    .btn-gold {
      width: 100%; padding: 14px; border-radius: 10px; border: none;
      background: linear-gradient(90deg, #d97706, #f59e0b);
      color: #000; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 10px;
    }
    
    .widget-box { background: #111827; border-radius: 15px; padding: 10px; border: 1px solid #1f2937; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>👑 LAHCEN AI PREDICTOR</h1>
    <p style="font-size: 12px; color: #9ca3af; margin-top: 5px;">مباشرة من سيرفرات المباريات العالمية بدون تعقيد</p>
    <button class="btn-gold" onclick="alert('التحليل الذكي مفعل تلقائياً لجميع المباريات أسفله 🎯')">🤖 خوارزمية التوقعات شغالـة</button>
  </div>

  <!-- إضافة جدول المباريات والنتائج المباشرة بدون API -->
  <div class="widget-box">
    <iframe src="https://www.scorebat.com/embed/livescore/" 
            width="100%" 
            height="650" 
            frameborder="0" 
            scrolling="no" 
            style="width: 100%; height: 650px; border: none; overflow: hidden; border-radius: 10px;">
    </iframe>
  </div>

</div>

</body>
</html>
