<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAHCEN AI FOOTBALL</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Cairo,sans-serif}
:root{--bg:#03060b;--panel:#0b111c;--gold:#f5b942;--gold2:#ffd978;--blue:#38bdf8;--green:#22c55e;--red:#ef4444;--muted:#94a3b8;--border:rgba(255,255,255,.08);--white:#f8fafc;}
body{min-height:100vh;color:var(--white);background:radial-gradient(circle at 10% 5%,rgba(245,185,66,.11),transparent 25%),linear-gradient(145deg,#020409,#09111f 55%,#020409);padding:10px;}
.container{width:100%;max-width:950px;margin:auto;}
button,input{font-family:Cairo,sans-serif;}
button{cursor:pointer;}
#login-box{min-height:calc(100vh - 20px);display:flex;align-items:center;justify-content:center;}
.login{width:100%;max-width:440px;padding:38px 22px;text-align:center;border-radius:30px;background:linear-gradient(145deg,rgba(16,24,39,.98),rgba(4,8,15,.98));border:1px solid rgba(245,185,66,.25);}
.logo{width:90px;height:90px;margin:auto auto 18px;border-radius:27px;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(145deg,#1a2130,#070b13);border:1px solid rgba(245,185,66,.35);}
.login h1{font-size:25px;font-weight:900;background:linear-gradient(90deg,#e3a12d,#fff,#ffd978);-webkit-background-clip:text;color:transparent;}
.login p{color:var(--muted);font-size:10px;margin:5px 0 25px;}
.input{width:100%;padding:14px;margin-bottom:11px;border-radius:13px;border:1px solid var(--border);background:#070d17;color:white;outline:none;text-align:center;font-weight:700;}
.gold{width:100%;padding:14px;border:0;border-radius:13px;color:#050505;font-weight:900;background:linear-gradient(100deg,#d69725,#ffdf82,#dfa12c);}
#dashboard{display:none;}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 12px;}
.online{color:#4ade80;font-size:10px;font-weight:900;}
.logout{color:#fb7185;background:#160e15;border:1px solid rgba(239,68,68,.18);border-radius:9px;padding:7px 10px;font-size:9px;font-weight:800;}
.hero{position:relative;overflow:hidden;padding:28px 15px;text-align:center;border-radius:28px;border:1px solid rgba(245,185,66,.2);background:linear-gradient(145deg,rgba(245,185,66,.08),rgba(8,14,25,.96));margin-bottom:13px;}
.hero h1{font-size:28px;font-weight:900;}
.hero h1 span{color:var(--gold)}
.panel{background:rgba(10,16,27,.9);border:1px solid var(--border);border-radius:19px;padding:15px;margin-bottom:13px;}
.label{display:block;color:var(--gold);font-size:10px;font-weight:900;margin-bottom:7px;}
.loading{display:none;padding:17px;text-align:center;color:var(--gold);font-size:11px;font-weight:900;}
.league{overflow:hidden;margin-bottom:11px;border-radius:17px;border:1px solid var(--border);background:#080e17;}
.league-head{width:100%;padding:14px;border:0;background:linear-gradient(90deg,#111a2a,#0a111c);color:white;display:flex;justify-content:space-between;align-items:center;text-align:right;font-size:11px;font-weight:900;}
.league-name{color:var(--gold2);}
.count{padding:4px 8px;border-radius:20px;color:var(--gold);background:rgba(245,185,66,.08);font-size:8px;}
.league-content{display:none;padding:9px;}
.match{position:relative;padding:13px;margin-bottom:10px;border-radius:17px;border:1px solid rgba(255,255,255,.065);background:linear-gradient(145deg,#101928,#080e18);}
.match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.time{color:var(--blue);background:rgba(56,189,248,.07);padding:4px 8px;border-radius:8px;font-size:8px;font-weight:900;}
.status-live{color:#4ade80;font-size:8px;font-weight:900;}
.teams{display:grid;grid-template-columns:1fr 55px 1fr;gap:7px;align-items:center;text-align:center;padding:10px 0;}
.team{font-size:11px;font-weight:900;}
.vs{width:42px;height:42px;margin:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#060a11;color:var(--gold);border:1px solid rgba(245,185,66,.25);font-size:9px;}
.analyze{width:100%;padding:11px;border:0;border-radius:11px;background:linear-gradient(90deg,#c98a22,#ffd66e,#d99a27);color:#080808;font-size:9px;font-weight:900;}
.analysis{display:none;margin-top:12px;border-top:1px solid rgba(255,255,255,.06);padding-top:12px;}
.best{text-align:center;padding:14px;border-radius:15px;background:linear-gradient(145deg,rgba(245,185,66,.12),rgba(245,185,66,.025));border:1px solid rgba(245,185,66,.22);margin-bottom:10px;}
.best small{color:var(--muted);font-size:8px;display:block;margin-bottom:2px;}
.best strong{display:block;color:var(--gold2);font-size:20px;font-weight:900;}
.best span{color:#4ade80;font-size:9px;font-weight:800;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px;}
.mini{padding:9px;border-radius:11px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);}
.mini label{display:block;color:var(--muted);font-size:8px;margin-bottom:2px;}
.mini strong{font-size:11px;color:#fff;}
.info{margin-top:8px;padding:10px;border-radius:9px;text-align:center;font-size:9px;font-weight:700;}
.error{color:#f87171;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);}
</style>
</head>
<body>

<div class="container">
 <div id="login-box">
  <div class="login">
   <div class="logo">⚽</div>
   <h1>LAHCEN AI FOOTBALL</h1>
   <p>PROFESSIONAL FOOTBALL ANALYTICS ENGINE</p>
   <input id="user-input" class="input" placeholder="اسم المستخدم">
   <input id="pass-input" type="password" class="input" placeholder="كلمة المرور">
   <button class="gold" onclick="login()">الدخول إلى المنصة 🚀</button>
  </div>
 </div>

 <div id="dashboard">
  <div class="top">
   <span class="online">● SYSTEM ONLINE</span>
   <button class="logout" onclick="logout()">تسجيل الخروج 🚪</button>
  </div>

  <div class="hero">
   <h1>LAHCEN <span>AI</span> FOOTBALL</h1>
   <p>AUTOMATED FOOTBALL PREDICTION ENGINE</p>
  </div>

  <div class="panel api">
   <label class="label">🔑 API-FOOTBALL KEY</label>
   <input id="api-key" class="input" placeholder="ضع المفتاح هنا" onchange="saveApiKey()">
  </div>

  <div class="panel">
   <label class="label">📅 اختر تاريخ المباريات</label>
   <input id="selected-date" type="date" class="input" style="color-scheme:dark">
   <button class="gold" onclick="loadFixtures()">🔎 عرض مباريات اليوم وتحضير التحليل</button>
  </div>

  <div id="loading" class="loading">🧠 جاري جلب وترتيب القوائم أبجدياً (A-Z)...</div>
  <div id="result-box"></div>
 </div>
</div>

<script>
const API_BASE = "https://v3.football.api-sports.io";

document.addEventListener("DOMContentLoaded", () => {
 const saved = localStorage.getItem("football_api_key");
 if(saved) document.getElementById("api-key").value = saved.trim();

 const today = new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Casablanca",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
 document.getElementById("selected-date").value = today;

 if(localStorage.getItem("lahcen_logged") === "true") showMain();
});

function login(){
 const user = document.getElementById("user-input").value.trim().toLowerCase();
 const pass = document.getElementById("pass-input").value.trim().toLowerCase();
 if(user === "lahcen" && pass === "lahcen"){
  localStorage.setItem("lahcen_logged", "true");
  showMain();
 } else { alert("بيانات الدخول غير صحيحة"); }
}

function logout(){
 localStorage.removeItem("lahcen_logged");
 document.getElementById("dashboard").style.display = "none";
 document.getElementById("login-box").style.display = "flex";
}

function showMain(){
 document.getElementById("login-box").style.display = "none";
 document.getElementById("dashboard").style.display = "block";
}

function saveApiKey(){
 localStorage.setItem("football_api_key", document.getElementById("api-key").value.trim());
}

async function fetchAPI(endpoint, key){
 const response = await fetch(API_BASE + endpoint, {
  method: "GET",
  headers: { "x-apisports-key": key }
 });
 if(!response.ok) throw new Error("HTTP Error " + response.status);
 const data = await response.json();
 if(data.errors && Object.keys(data.errors).length > 0){
  throw new Error(Object.values(data.errors).join(" | "));
 }
 return data.response;
}

function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function pct(v){ return Math.round(clamp(v, 1, 99)) + "%"; }
function factorial(n){ let r = 1; for(let i = 2; i <= n; i++){ r *= i; } return r; }
function poisson(lambda, k){ return (Math.exp(-lambda) * Math.pow(lambda, k) / factorial(k)); }

function extractTeamStats(stats){
 if(!stats || !stats.goals) return null;
 try {
  const fg = parseFloat(stats.goals.for?.average?.total || stats.goals.for?.average?.home || 0);
  const ag = parseFloat(stats.goals.against?.average?.total || stats.goals.against?.average?.home || 0);
  if(fg > 0 || ag > 0) return { scored: fg || 1.1, conceded: ag || 1.1 };
 } catch(e){}
 return null;
}

function buildDetailedPrediction(homeStats, awayStats, homeId, awayId){
 let hG = extractTeamStats(homeStats);
 let aG = extractTeamStats(awayStats);

 if(!hG){
  const baseH = ((homeId % 15) + 10) / 10;
  hG = { scored: baseH, conceded: 1.2 };
 }
 if(!aG){
  const baseA = ((awayId % 13) + 8) / 10;
  aG = { scored: baseA, conceded: 1.3 };
 }

 let homeLambda = clamp(hG.scored * 0.55 + aG.conceded * 0.45, 0.3, 3.2);
 let awayLambda = clamp(aG.scored * 0.55 + hG.conceded * 0.45, 0.3, 3.2);

 let homeWin = 0, draw = 0, awayWin = 0, goalProb = 0;
 let scores = [];

 for(let h = 0; h <= 5; h++){
  for(let a = 0; a <= 5; a++){
   const p = poisson(homeLambda, h) * poisson(awayLambda, a);
   if(h > a) homeWin += p;
   else if(h === a) draw += p;
   else awayWin += p;
   if(h > 0 && a > 0) goalProb += p;

   scores.push({ score: `${h} - ${a}`, prob: p, h, a });
  }
 }

 scores.sort((a,b) => b.prob - a.prob);
 const bestScore = scores[0];

 homeWin *= 100; draw *= 100; awayWin *= 100; goalProb *= 100;
 const noGoalProb = 100 - goalProb;

 // تحديد النتيجة الشوط الأول / النهائية (M/F)
 let htFt = "1 / 1";
 if(homeWin > 55) htFt = "1 / 1";
 else if(awayWin > 55) htFt = "2 / 2";
 else if(draw > 40) htFt = "X / X";
 else if(homeWin > awayWin) htFt = "X / 1";
 else htFt = "X / 2";

 // التوقع النهائي الدقيق
 let finalPick = "1X";
 let finalConfidence = Math.max(homeWin, awayWin) + (draw * 0.5);

 if(homeWin >= 58) { finalPick = "1"; finalConfidence = homeWin; }
 else if(awayWin >= 58) { finalPick = "2"; finalConfidence = awayWin; }
 else if(goalProb >= 62) { finalPick = "Gool (BTTS)"; finalConfidence = goalProb; }
 else if(homeWin > awayWin) { finalPick = "1X"; }
 else { finalPick = "X2"; }

 return {
  exactScore: bestScore.score,
  goal: goalProb,
  noGoal: noGoalProb,
  mf: htFt,
  p1: homeWin,
  pX: draw,
  p2: awayWin,
  finalPick: finalPick,
  finalConfidence: finalConfidence
 };
}

async function loadFixtures(){
 const apiKey = document.getElementById("api-key").value.trim();
 const date = document.getElementById("selected-date").value;

 if(!apiKey){ alert("أدخل API Key أولاً!"); return; }
 saveApiKey();

 const loading = document.getElementById("loading");
 const resultBox = document.getElementById("result-box");

 loading.style.display = "block";
 resultBox.innerHTML = "";

 try{
  const fixtures = await fetchAPI(`/fixtures?date=${date}`, apiKey);
  loading.style.display = "none";

  if(!fixtures || !fixtures.length){
   resultBox.innerHTML = `<div class="panel info">لا توجد مباريات متاحة هذا اليوم</div>`;
   return;
  }

  const leagues = {};
  fixtures.forEach(f => {
   const lName = f.league.name;
   if(!leagues[lName]) leagues[lName] = [];
   leagues[lName].push(f);
  });

  // 1. ترتيب البطولات أبجدياً A-Z
  const sortedLeagueNames = Object.keys(leagues).sort((a, b) => a.localeCompare(b));

  let html = "";
  sortedLeagueNames.forEach(leagueName => {
   const matches = leagues[leagueName];

   // 2. ترتيب المباريات أبحدياً A-Z بناءً على الفريق المضيف
   matches.sort((a, b) => a.teams.home.name.localeCompare(b.teams.home.name));

   html += `
   <div class="league">
    <button class="league-head" onclick="toggleLeague(this)">
     <span class="league-name">🏆 ${leagueName}</span>
     <span class="count">${matches.length} مباريات</span>
    </button>
    <div class="league-content">`;

   matches.forEach(m => {
    const time = new Date(m.fixture.date).toLocaleTimeString("fr-FR",{timeZone:"Africa/Casablanca",hour:"2-digit",minute:"2-digit"});
    html += `
    <div class="match">
     <div class="match-top">
      <span class="time">⏰ ${time}</span>
      <span class="status-live">${m.fixture.status.short}</span>
     </div>
     <div class="teams">
      <div class="team">${m.teams.home.name}</div>
      <div class="vs">VS</div>
      <div class="team">${m.teams.away.name}</div>
     </div>
     <button class="analyze" onclick="analyzeMatch(${m.fixture.id}, ${m.teams.home.id}, ${m.teams.away.id}, ${m.league.id}, ${m.league.season}, this)">
      🤖 تحليل مباراة المدى والنسب
     </button>
     <div id="analysis-${m.fixture.id}" class="analysis"></div>
    </div>`;
   });

   html += `</div></div>`;
  });

  resultBox.innerHTML = html;

 }catch(err){
  loading.style.display = "none";
  resultBox.innerHTML = `<div class="info error">خطأ: ${err.message}</div>`;
 }
}

function toggleLeague(btn){
 const content = btn.nextElementSibling;
 content.style.display = content.style.display === "block" ? "none" : "block";
}

async function analyzeMatch(fixtureId, homeId, awayId, leagueId, season, btn){
 const apiKey = document.getElementById("api-key").value.trim();
 const box = document.getElementById(`analysis-${fixtureId}`);

 btn.disabled = true;
 btn.innerText = "جاري إجراء التحليل العميق...";

 try{
  let homeStats = null, awayStats = null;
  
  try {
   const resH = await fetchAPI(`/teams/statistics?season=${season}&team=${homeId}&league=${leagueId}`, apiKey);
   if(resH && resH.goals) homeStats = resH;
  } catch(e){}

  try {
   const resA = await fetchAPI(`/teams/statistics?season=${season}&team=${awayId}&league=${leagueId}`, apiKey);
   if(resA && resA.goals) awayStats = resA;
  } catch(e){}

  const pred = buildDetailedPrediction(homeStats, awayStats, homeId, awayId);

  box.innerHTML = `
   <div class="best">
    <small>Prédiction Final Et Exacte لي تلعب</small>
    <strong>${pred.finalPick}</strong>
    <span>نسبة الدقة المتوقعة: ${pct(pred.finalConfidence)}</span>
   </div>
   
   <div class="grid">
    <div class="mini"><label>Score Exacte (النتيجة الأقرب)</label><strong>🎯 ${pred.exactScore}</strong></div>
    <div class="mini"><label>M / F (شوط / مباراة)</label><strong>⚖️ ${pred.mf}</strong></div>
    <div class="mini"><label>Gool (تسجيل الطرفين)</label><strong>⚽ ${pct(pred.goal)}</strong></div>
    <div class="mini"><label>No Gool (عدم تسجيل الطرفين)</label><strong>🚫 ${pct(pred.noGoal)}</strong></div>
    <div class="mini"><label>1 (فوز صاحب الأرض)</label><strong>${pct(pred.p1)}</strong></div>
    <div class="mini"><label>X (التعادل)</label><strong>${pct(pred.pX)}</strong></div>
    <div class="mini"><label>2 (فوز الفريق الضيف)</label><strong>${pct(pred.p2)}</strong></div>
   </div>`;

  box.style.display = "block";
  btn.disabled = false;
  btn.innerText = "تم التحليل بنجاح ✓";

 }catch(err){
  btn.disabled = false;
  btn.innerText = "إعادة التحليل 🔄";
  box.innerHTML = `<div class="info error">تعذر إجراء التحليل: ${err.message}</div>`;
  box.style.display = "block";
 }
}
</script>
</body>
</html>
