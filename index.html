<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAHCEN VIP - MULTI-LANGUAGE REAL ANALYTICS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg, #07090e 0%, #0f172a 100%); color: #f3f4f6; min-height: 100vh; padding: 15px; display: flex; justify-content: center; align-items: flex-start; }
    .container { width: 100%; max-width: 550px; margin-top: 10px; }
    #login-box { background: rgba(17, 24, 39, 0.95); border: 1px solid #f59e0b; padding: 35px 20px; border-radius: 20px; text-align: center; box-shadow: 0 15px 35px rgba(245, 158, 11, 0.15); margin-top: 40px; }
    #login-box h2 { color: #f59e0b; font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    #login-box p { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
    .input-field { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 15px; outline: none; margin-bottom: 12px; font-weight: bold; text-align: center; }
    #dashboard { display: none; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: #f59e0b; font-size: 22px; font-weight: 900; }
    .header p { color: #10b981; font-size: 12px; font-weight: bold; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .btn-logout { background: #374151; color: #ef4444; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: bold; }
    .card-box { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 20px; }
    .date-label { font-size: 12px; color: #f59e0b; font-weight: 700; display: block; margin-bottom: 5px; text-align: right; }
    .btn-gold { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(90deg, #d97706 0%, #f59e0b 100%); color: #000; font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); margin-top: 5px; }
    .btn-gold:hover { transform: translateY(-2px); }
    .match-card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 16px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); border-right: 4px solid #f59e0b; }
    .teams-header { text-align: center; font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #1f2937; }
    .teams-header span { color: #f59e0b; }
    .section-title { font-size: 13px; color: #38bdf8; font-weight: 800; margin: 12px 0 6px 0; text-align: right; border-right: 3px solid #38bdf8; padding-right: 8px; }
    .prob-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    .prob-table td { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid #1f2937; }
    .prob-name { color: #d1d5db; font-weight: 700; text-align: right; }
    .prob-val { color: #10b981; font-weight: 900; text-align: left; }
    .prob-val.highlight { color: #f59e0b; font-size: 13px; }
    #loading { display: none; text-align: center; color: #f59e0b; padding: 15px; font-weight: bold; font-size: 13px; }
    .api-settings { background: #1e1e1e; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed #ef4444; }
  </style>
</head>
<body>

<div class="container">
  <div id="login-box">
    <h2>👑 LAHCEN VIP ENGINE</h2>
    <p>بوابة التحليل المباشر (دعم جميع اللغات)</p>
    <input type="text" id="user-input" class="input-field" placeholder="اسم المستكشف (lahcen)">
    <input type="password" id="pass-input" class="input-field" placeholder="كلمة المرور (lahcen)">
    <button class="btn-gold" onclick="login()">الدخول إلى المنصة 🚀</button>
  </div>

  <div id="dashboard">
    <div class="top-bar">
      <span style="font-size: 11px; color: #10b981; font-weight: bold;">🟢 متصل بنجاح</span>
      <button class="btn-logout" onclick="logout()">تسجيل الخروج 🚪</button>
    </div>

    <div class="header">
      <h1>🧠 LAHCEN REAL ANALYTICS</h1>
      <p id="api-status">⚠️ جاري التحقق من مفتاح API...</p>
    </div>

    <div class="api-settings">
      <label class="date-label" style="color: #ef4444;">🔑 مفتاح API-Football الخاص بك:</label>
      <input type="text" id="api-key" class="input-field" placeholder="ضع مفتاح API هنا..." onchange="saveApiKey()">
    </div>

    <div class="card-box">
      <label class="date-label">🏠 الفريق المضيف (بالعربية أو الفرنسية أو الإنجليزية):</label>
      <input type="text" id="home-team" class="input-field" placeholder="مثال: توتنهام / Tottenham / Real Madrid">
      
      <label class="date-label">✈️ الفريق الضيف:</label>
      <input type="text" id="away-team" class="input-field" placeholder="مثال: نيوكاسل / Newcastle / Barcelona">
      
      <button class="btn-gold" onclick="analyzeMatch()">🤖 جلب الإحصائيات الحقيقية وتحليلها</button>
    </div>

    <div id="loading">🔍 جاري التعرف على أسماء الفرق وجلب البيانات المباشرة...</div>
    <div id="result-box"></div>
  </div>
</div>

<script>
  // قاموس الترجمة الذكي للفرق الشائعة
  const teamDictionary = {
    "توتنهام": "Tottenham", "توتنهام هوتسبير": "Tottenham",
    "نيوكاسل": "Newcastle", "نيوكاسل يونايتد": "Newcastle",
    "ريال مدريد": "Real Madrid", "برشلونة": "Barcelona", "بارسلونة": "Barcelona",
    "ليفربول": "Liverpool", "مانشستر سيتي": "Manchester City", "مان سيتي": "Manchester City",
    "مانشستر يونايتد": "Manchester United", "مان يونايتد": "Manchester United",
    "أرسنال": "Arsenal", "ارسنال": "Arsenal", "تشيلسي": "Chelsea",
    "بايرن ميونخ": "Bayern Munich", "باريس سان جيرمان": "Paris Saint Germain", "بي اس جي": "Paris Saint Germain",
    "انتر ميلان": "Inter", "إنتر ميلان": "Inter", "ميلان": "AC Milan", "اي سي ميلان": "AC Milan",
    "يوفنتوس": "Juventus", "اتلتيكو مدريد": "Atletico Madrid", "أتدلتيكو مدريد": "Atletico Madrid",
    "الوداد": "Wydad AC", "الرجاء": "Raja Club Athletic", "الجيش الملكي": "FAR Rabat"
  };

  function normalizeTeamName(name) {
    let cleanName = name.trim();
    if (teamDictionary[cleanName]) {
      return teamDictionary[cleanName];
    }
    return cleanName;
  }

  document.addEventListener("DOMContentLoaded", function() {
    if (localStorage.getItem("lahcen_logged") === "true") {
      showMain();
    }
    const savedKey = localStorage.getItem("football_api_key");
    if(savedKey) {
      document.getElementById("api-key").value = savedKey;
      document.getElementById("api-status").innerText = "✅ مفتاح API محفوظ وجاهز للعمل";
      document.getElementById("api-status").style.color = "#10b981";
    }
  });

  function login() {
    var u = document.getElementById("user-input").value.trim().toLowerCase();
    var p = document.getElementById("pass-input").value.trim().toLowerCase();
    if (u === "lahcen" && p === "lahcen") {
      localStorage.setItem("lahcen_logged", "true");
      showMain();
    } else {
      alert("بيانات الدخول غير صحيحة!");
    }
  }

  function logout() {
    localStorage.removeItem("lahcen_logged");
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("login-box").style.display = "block";
  }

  function showMain() {
    document.getElementById("login-box").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
  }

  function saveApiKey() {
    const key = document.getElementById("api-key").value.trim();
    localStorage.setItem("football_api_key", key);
    document.getElementById("api-status").innerText = "✅ تم حفظ المفتاح";
    document.getElementById("api-status").style.color = "#10b981";
  }

  async function fetchTeamWithFallback(teamInput, headers) {
    let searchName = normalizeTeamName(teamInput);
    
    // محاولة البحث الأولى
    let res = await fetch(`https://v3.football.api-sports.io/teams?search=${encodeURIComponent(searchName)}`, { headers });
    let data = await res.json();

    // إذا لم يجد نتيجة وكانت الكلمة مكتوبة بالإنجليزية ولكن أخطأ فيها المستخدم، نجرّب البحث بأول كلمة فقط
    if ((!data.response || data.response.length === 0) && searchName.includes(" ")) {
      let firstWord = searchName.split(" ")[0];
      res = await fetch(`https://v3.football.api-sports.io/teams?search=${encodeURIComponent(firstWord)}`, { headers });
      data = await res.json();
    }

    return data;
  }

  async function analyzeMatch() {
    const homeInput = document.getElementById("home-team").value.trim();
    const awayInput = document.getElementById("away-team").value.trim();
    const apiKey = document.getElementById("api-key").value.trim();
    const resultBox = document.getElementById("result-box");
    const loading = document.getElementById("loading");

    if (!homeInput || !awayInput) { alert("أدخل أسماء الفرق!"); return; }
    if (!apiKey) { alert("ضروري تدخل مفتاح API باش يجيب بيانات حقيقية!"); return; }

    resultBox.innerHTML = "";
    loading.style.display = "block";

    const headers = {
      "x-apisports-key": apiKey,
      "Content-Type": "application/json"
    };

    try {
      // 1. البحث عن الفريق المضيف
      const dataHome = await fetchTeamWithFallback(homeInput, headers);
      if (!dataHome.response || dataHome.response.length === 0) throw new Error(`لم يتم العثور على فريق: ${homeInput}`);
      const homeId = dataHome.response[0].team.id;
      const homeName = dataHome.response[0].team.name;

      // 2. البحث عن الفريق الضيف
      const dataAway = await fetchTeamWithFallback(awayInput, headers);
      if (!dataAway.response || dataAway.response.length === 0) throw new Error(`لم يتم العثور على فريق: ${awayInput}`);
      const awayId = dataAway.response[0].team.id;
      const awayName = dataAway.response[0].team.name;

      // 3. جلب المواجهات المباشرة (Head to Head)
      const resH2H = await fetch(`https://v3.football.api-sports.io/fixtures/headtohead?h2h=${homeId}-${awayId}&last=10`, { headers });
      const dataH2H = await resH2H.json();
      
      let matches = dataH2H.response;
      loading.style.display = "none";

      if (!matches || matches.length === 0) {
        resultBox.innerHTML = `<p style="text-align:center; color:#ef4444; padding: 15px;">❌ لا توجد مواجهات سابقة مسجلة بين ${homeName} و ${awayName}.</p>`;
        return;
      }

      // 4. تحليل النتائج
      let homeWins = 0, awayWins = 0, draws = 0;
      let over25 = 0, btts = 0;
      let totalMatches = matches.length;

      matches.forEach(m => {
        let hGoals = m.goals.home;
        let aGoals = m.goals.away;
        if (hGoals === null || aGoals === null) return;

        if (m.teams.home.id === homeId) {
          if (hGoals > aGoals) homeWins++;
          else if (hGoals < aGoals) awayWins++;
          else draws++;
        } else {
          if (aGoals > hGoals) homeWins++;
          else if (aGoals < hGoals) awayWins++;
          else draws++;
        }

        if ((hGoals + aGoals) > 2.5) over25++;
        if (hGoals > 0 && aGoals > 0) btts++;
      });

      let p1 = Math.round((homeWins / totalMatches) * 100);
      let p2 = Math.round((awayWins / totalMatches) * 100);
      let pX = Math.round((draws / totalMatches) * 100);
      
      let pPlus25 = Math.round((over25 / totalMatches) * 100);
      let pMoins25 = 100 - pPlus25;
      
      let pGoal = Math.round((btts / totalMatches) * 100);
      let pNoGoal = 100 - pGoal;

      if (p1 === 0) { p1 = 10; p2 -= 5; pX -= 5; }
      if (p2 === 0) { p2 = 10; p1 -= 5; pX -= 5; }

      resultBox.innerHTML = `
        <div class="match-card">
          <div class="teams-header">${homeName} <span>VS</span> ${awayName}</div>
          <p style="text-align:center; font-size:10px; color:#10b981; margin-bottom:10px;">📊 بناءً على آخر ${totalMatches} مواجهات حقيقية</p>

          <div class="section-title">🎯 النتيجة النهائية (1X2)</div>
          <table class="prob-table">
            <tr><td class="prob-name">فوز ${homeName} (1)</td><td class="prob-val ${p1 > 40 ? 'highlight' : ''}">${Math.abs(p1)}%</td></tr>
            <tr><td class="prob-name">التعادل (X)</td><td class="prob-val">${Math.abs(pX)}%</td></tr>
            <tr><td class="prob-name">فوز ${awayName} (2)</td><td class="prob-val ${p2 > 40 ? 'highlight' : ''}">${Math.abs(p2)}%</td></tr>
          </table>

          <div class="section-title">⚽ مجموع الأهداف (2.5)</div>
          <table class="prob-table">
            <tr><td class="prob-name">Plus 2.5 (أكثر من 2.5)</td><td class="prob-val ${pPlus25 >= 50 ? 'highlight' : ''}">${pPlus25}%</td></tr>
            <tr><td class="prob-name">Moins 2.5 (أقل من 2.5)</td><td class="prob-val ${pMoins25 >= 50 ? 'highlight' : ''}">${pMoins25}%</td></tr>
          </table>

          <div class="section-title">🥅 التسجيل للفريقين (BTTS)</div>
          <table class="prob-table">
            <tr><td class="prob-name">Gool (كلا الفريقين سيسجل)</td><td class="prob-val ${pGoal >= 50 ? 'highlight' : ''}">${pGoal}%</td></tr>
            <tr><td class="prob-name">No Gool (أحدهما لن يسجل)</td><td class="prob-val ${pNoGoal >= 50 ? 'highlight' : ''}">${pNoGoal}%</td></tr>
          </table>
        </div>
      `;

    } catch (error) {
      loading.style.display = "none";
      resultBox.innerHTML = `<p style="text-align:center; color:#ef4444; padding:15px;">❌ خطأ: ${error.message}</p>`;
    }
  }
</script>
</body>
</html>
