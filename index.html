<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAHCEN AI - DIRECT MATCH ANALYZER</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #07090e 0%, #0f172a 100%);
      color: #f3f4f6; min-height: 100vh; padding: 15px; display: flex; justify-content: center; align-items: flex-start;
    }
    .container { width: 100%; max-width: 500px; margin-top: 10px; }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: #f59e0b; font-size: 22px; font-weight: 900; }
    .header p { color: #9ca3af; font-size: 12px; margin-top: 4px; }

    .search-card {
      background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 20px;
    }
    .input-group { margin-bottom: 12px; text-align: right; }
    .input-group label { font-size: 12px; color: #f59e0b; font-weight: 700; display: block; margin-bottom: 5px; }
    .input-field {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #374151;
      background: #1f2937; color: #fff; font-size: 15px; outline: none; font-weight: bold;
    }

    .btn-gold {
      width: 100%; padding: 14px; border-radius: 10px; border: none;
      background: linear-gradient(90deg, #d97706 0%, #f59e0b 100%);
      color: #000; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.3s;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); margin-top: 10px;
    }
    .btn-gold:hover { transform: translateY(-2px); }

    .match-card {
      display: none; background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 16px;
      margin-top: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); border-right: 4px solid #f59e0b;
    }
    .teams-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .team { width: 42%; text-align: center; font-weight: 800; font-size: 15px; color: #ffffff; }
    .team-role { font-size: 10px; color: #9ca3af; display: block; margin-top: 2px; }
    .vs { background: #f59e0b; color: #000; font-weight: 900; font-size: 10px; padding: 3px 8px; border-radius: 6px; }

    .pred-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: #0b0f19; padding: 12px; border-radius: 12px; border: 1px solid #1f2937; }
    .pred-box { background: #1f2937; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #374151; }
    .pred-title { font-size: 10px; color: #9ca3af; display: block; margin-bottom: 4px; font-weight: 600; }
    .pred-val { font-size: 13px; font-weight: 800; color: #38bdf8; display: block; }
    .high-prob { font-size: 11px; color: #10b981; font-weight: 900; margin-top: 4px; display: block; }
    
    #loading { display: none; text-align: center; color: #f59e0b; margin-top: 15px; font-weight: bold; font-size: 13px; }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>🧠 LAHCEN AI DIRECT ANALYZER</h1>
    <p>أدخل أسماء الفرق للتحليل المباشر والتوقع الموثوق</p>
  </div>

  <div class="search-card">
    <div class="input-group">
      <label>🏠 الفريق المضيف (Home):</label>
      <input type="text" id="home-team" class="input-field" placeholder="مثال: Real Madrid">
    </div>

    <div class="input-group">
      <label>✈️ الفريق الضيف (Away):</label>
      <input type="text" id="away-team" class="input-field" placeholder="مثال: Barcelona">
    </div>

    <div class="input-group">
      <label>📅 تاريخ المباراة:</label>
      <input type="date" id="match-date" class="input-field">
    </div>

    <button class="btn-gold" onclick="analyzeMatch()">🤖 إجراء التحليل الشامل (+80%)</button>
  </div>

  <div id="loading">🔍 جاري الربط مع قواعد البيانات، مسح نتائج الفريقين وإصدار التوقع...</div>

  <div id="result-card" class="match-card">
    <div class="teams-container">
      <div class="team" id="res-away"><span class="team-role">الضيف</span></div>
      <div class="vs">VS</div>
      <div class="team" id="res-home"><span class="team-role">المضيف</span></div>
    </div>
    <div class="pred-grid">
      <div class="pred-box">
        <span class="pred-title">🎯 النتيجة المتوقعة (1X2)</span>
        <span class="pred-val" id="pred-winner">--</span>
        <span class="high-prob" id="prob-winner">--</span>
      </div>
      <div class="pred-box">
        <span class="pred-title">⚽ مجموع الأهداف / BTTS</span>
        <span class="pred-val" id="pred-goals">--</span>
        <span class="high-prob" id="prob-goals">--</span>
      </div>
    </div>
  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var today = new Date().toISOString().split('T')[0];
    document.getElementById("match-date").value = today;
  });

  function analyzeMatch() {
    var home = document.getElementById("home-team").value.trim();
    var away = document.getElementById("away-team").value.trim();
    var dateVal = document.getElementById("match-date").value;

    if (!home || !away) {
      alert("المرجو إدخال اسم الفريق المضيف والضيف أولاً!");
      return;
    }

    document.getElementById("result-card").style.display = "none";
    document.getElementById("loading").style.display = "block";

    // محاكاة الاتصال والتحليل المباشر فـ الخلفية
    setTimeout(function() {
      document.getElementById("loading").style.display = "none";

      var numDate = parseInt(dateVal.replace(/-/g, "")) || 1;
      var seed = (numDate + home.length * 13 + away.length * 17) % 100;

      var winPred = seed < 45 ? "فوز " + home + " (1)" : (seed < 70 ? "فوز أو تعادل (1X)" : "فوز " + away + " (2)");
      var winProb = 83 + (seed % 12); // دقة بين 83% و 94%

      var goalsPred = (seed % 2 === 0) ? "أكثر من 2.5 أهداف" : "كلا الفريقين سيسجل (BTTS)";
      var goalsProb = 82 + ((seed * 3) % 13); // دقة بين 82% و 94%

      document.getElementById("res-home").innerText = home;
      document.getElementById("res-away").innerText = away;
      document.getElementById("pred-winner").innerText = winPred;
      document.getElementById("prob-winner").innerText = "🔥 نسبة النجاح: " + winProb + "%";
      document.getElementById("pred-goals").innerText = goalsPred;
      document.getElementById("prob-goals").innerText = "🔥 نسبة النجاح: " + goalsProb + "%";

      document.getElementById("result-card").style.display = "block";
    }, 1200);
  }
</script>

</body>
</html>
