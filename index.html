<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAHCEN LEAGUES & MATCHES VIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg, #07090e 0%, #0f172a 100%); color: #f3f4f6; min-height: 100vh; padding: 15px; display: flex; justify-content: center; align-items: flex-start; }
    .container { width: 100%; max-width: 650px; margin-top: 10px; }
    #login-box { background: rgba(17, 24, 39, 0.95); border: 1px solid #f59e0b; padding: 35px 20px; border-radius: 20px; text-align: center; box-shadow: 0 15px 35px rgba(245, 158, 11, 0.15); margin-top: 40px; }
    #login-box h2 { color: #f59e0b; font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .input-field { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 15px; outline: none; margin-bottom: 12px; font-weight: bold; text-align: center; }
    #dashboard { display: none; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: #f59e0b; font-size: 22px; font-weight: 900; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .btn-logout { background: #374151; color: #ef4444; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: bold; }
    .card-box { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 20px; }
    .date-label { font-size: 13px; color: #f59e0b; font-weight: 700; display: block; margin-bottom: 6px; text-align: right; }
    .btn-gold { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(90deg, #d97706 0%, #f59e0b 100%); color: #000; font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); margin-top: 5px; }
    
    /* تصميم تقسيم البطولات */
    .league-accordion { background: #1f2937; border: 1px solid #374151; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .league-header-btn { width: 100%; background: #111827; color: #f59e0b; padding: 14px; text-align: right; border: none; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .league-header-btn:hover { background: #1a2436; }
    .league-count { background: #d97706; color: #000; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .league-content { display: none; padding: 12px; background: #0b0f19; }

    .match-card { background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 14px; margin-bottom: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.3); border-right: 4px solid #f59e0b; }
    .teams-header { text-align: center; font-size: 15px; font-weight: 900; color: #fff; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #1f2937; }
    .teams-header span { color: #f59e0b; }
    .section-title { font-size: 11px; color: #38bdf8; font-weight: 800; margin: 8px 0 4px 0; text-align: right; border-right: 3px solid #38bdf8; padding-right: 6px; }
    .prob-table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
    .prob-table td { padding: 5px 6px; font-size: 11px; border-bottom: 1px solid #1f2937; }
    .prob-name { color: #d1d5db; font-weight: 700; text-align: right; }
    .prob-val { color: #10b981; font-weight: 900; text-align: left; }
    .prob-val.highlight { color: #f59e0b; font-size: 12px; }
    #loading { display: none; text-align: center; color: #f59e0b; padding: 15px; font-weight: bold; font-size: 13px; }
    .api-settings { background: #1e1e1e; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed #ef4444; }
  </style>
</head>
<body>

<div class="container">
  <div id="login-box">
    <h2>👑 LAHCEN VIP ENGINE</h2>
    <p>تصنيف المباريات حسب البطولات والدوريات</p>
    <input type="text" id="user-input" class="input-field" placeholder="اسم المستكشف (lahcen)">
    <input type="password" id="pass-input" class="input-field" placeholder="كلمة المرور (lahcen)">
    <button class="btn-gold" onclick="login()">الدخول إلى المنصة 🚀</button>
  </div>

  <div id="dashboard">
    <div class="top-bar">
      <span style="font-size: 11px; color: #10b981; font-weight: bold;">🟢 متصل بنجاح</span>
      <button class="btn-logout" onclick="logout()">تسجيل الخروج 🚪</button>
    </div>

    <div class="header">
      <h1>🧠 LAHCEN LEAGUE ANALYTICS</h1>
      <p id="api-status" style="color:#10b981; font-size:12px; font-weight:bold;">✅ اختر الدوري الذي تريد تصفحه</p>
    </div>

    <div class="api-settings">
      <label class="date-label" style="color: #ef4444;">🔑 مفتاح API-Football الخاص بك:</label>
      <input type="text" id="api-key" class="input-field" placeholder="ضع مفتاح API هنا..." onchange="saveApiKey()">
    </div>

    <div class="card-box">
      <label class="date-label">📅 اختر التاريخ:</label>
      <input type="date" id="selected-date" class="input-field" style="color-scheme: dark;">
      <button class="btn-gold" onclick="loadMatchesByDate()">🔍 جلب وتقسيم المباريات حسب الدوري</button>
    </div>

    <div id="loading">🔍 جاري تجميع وتصنيف المباريات حسب الدوري...</div>
    <div id="result-box"></div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (localStorage.getItem("lahcen_logged") === "true") showMain();
    const savedKey = localStorage.getItem("football_api_key");
    if(savedKey) document.getElementById("api-key").value = savedKey;

    const today = new Date().toISOString().split('T')[0];
    document.getElementById("selected-date").value = today;
  });

  function login() {
    var u = document.getElementById("user-input").value.trim().toLowerCase();
    var p = document.getElementById("pass-input").value.trim().toLowerCase();
    if (u === "lahcen" && p === "lahcen") {
      localStorage.setItem("lahcen_logged", "true");
      showMain();
    } else { alert("بيانات الدخول غير صحيحة!"); }
  }

  function logout() {
    localStorage.removeItem("lahcen_logged");
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("login-box").style.display = "block";
  }

  function showMain() {
    document.getElementById("login-box").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
  }

  function saveApiKey() {
    const key = document.getElementById("api-key").value.trim();
    localStorage.setItem("football_api_key", key);
  }

  function toggleLeague(id) {
    const el = document.getElementById("league-content-" + id);
    if(el.style.display === "block") {
      el.style.display = "none";
    } else {
      el.style.display = "block";
    }
  }

  async function loadMatchesByDate() {
    const apiKey = document.getElementById("api-key").value.trim();
    const selectedDate = document.getElementById("selected-date").value;
    const resultBox = document.getElementById("result-box");
    const loading = document.getElementById("loading");

    if (!apiKey) { alert("أدخل مفتاح API أولاً!"); return; }
    if (!selectedDate) { alert("اختر التاريخ أولاً!"); return; }

    resultBox.innerHTML = "";
    loading.style.display = "block";

    const headers = { "x-apisports-key": apiKey, "Content-Type": "application/json" };

    try {
      const res = await fetch(`https://v3.football.api-sports.io/fixtures?date=${selectedDate}`, { headers });
      const data = await res.json();
      loading.style.display = "none";

      if (!data.response || data.response.length === 0) {
        resultBox.innerHTML = `<div style="text-align:center; padding: 20px; background:#111827; border-radius:12px;"><p style="color:#ef4444; font-weight:bold;">❌ لا توجد مباريات فـ هذا التاريخ (${selectedDate})</p></div>`;
        return;
      }

      // تجميع المباريات حسب اسم الدوري
      const groupedLeagues = {};
      data.response.forEach(item => {
        let leagueName = item.league.country + " - " + item.league.name;
        if (!groupedLeagues[leagueName]) {
          groupedLeagues[leagueName] = [];
        }
        groupedLeagues[leagueName].push(item);
      });

      let html = `<p style="text-align:center; color:#10b981; font-size:13px; font-weight:bold; margin-bottom:15px;">🏆 تم تصنيف ${Object.keys(groupedLeagues).length} بطولات/دوريات لهذا اليوم</p>`;

      let leagueIdx = 0;
      for (let leagueName in groupedLeagues) {
        leagueIdx++;
        let matches = groupedLeagues[leagueName];

        html += `
          <div class="league-accordion">
            <button class="league-header-btn" onclick="toggleLeague(${leagueIdx})">
              <span>🏆 ${leagueName}</span>
              <span class="league-count">${matches.length} مباريات 🔽</span>
            </button>
            <div id="league-content-${leagueIdx}" class="league-content">
        `;

        matches.forEach(item => {
          let homeName = item.teams.home.name;
          let awayName = item.teams.away.name;
          let id = item.fixture.id;

          let seed = (id + homeName.length * 7 + awayName.length * 11) % 100;

          let p1 = 35 + (seed % 30);
          let p2 = 25 + ((seed * 3) % 25);
          let pX = 100 - (p1 + p2);

          let pPlus25 = 45 + (seed % 35);
          let pMoins25 = 100 - pPlus25;

          let pGoal = 40 + ((seed * 2) % 40);
          let pNoGoal = 100 - pGoal;

          let pMF11 = Math.round(p1 * 0.65);
          let pMFX1 = Math.round(p1 * 0.35);
          let pMFXX = Math.round(pX * 0.70);
          let pMF22 = Math.round(p2 * 0.65);

          let s21 = 18 + (seed % 10);
          let s10 = 15 + (seed % 8);
          let s11 = 14 + (seed % 6);
          let s01 = 12 + (seed % 5);
          let sOther = 100 - (s21 + s10 + s11 + s01);

          html += `
            <div class="match-card">
              <div class="teams-header">${homeName} <span>VS</span> ${awayName}</div>

              <div class="section-title">🎯 النتيجة النهائية (1X2)</div>
              <table class="prob-table">
                <tr><td class="prob-name">فوز المضيف (1)</td><td class="prob-val ${p1 > 45 ? 'highlight' : ''}">${p1}%</td></tr>
                <tr><td class="prob-name">التعادل (X)</td><td class="prob-val">${pX}%</td></tr>
                <tr><td class="prob-name">فوز الضيف (2)</td><td class="prob-val ${p2 > 45 ? 'highlight' : ''}">${p2}%</td></tr>
              </table>

              <div class="section-title">⚽ الأهداف (2.5)</div>
              <table class="prob-table">
                <tr><td class="prob-name">Plus 2.5</td><td class="prob-val ${pPlus25 >= 50 ? 'highlight' : ''}">${pPlus25}%</td></tr>
                <tr><td class="prob-name">Moins 2.5</td><td class="prob-val ${pMoins25 >= 50 ? 'highlight' : ''}">${pMoins25}%</td></tr>
              </table>

              <div class="section-title">🥅 BTTS (التسجيل للفريقين)</div>
              <table class="prob-table">
                <tr><td class="prob-name">Gool</td><td class="prob-val ${pGoal >= 50 ? 'highlight' : ''}">${pGoal}%</td></tr>
                <tr><td class="prob-name">No Gool</td><td class="prob-val ${pNoGoal >= 50 ? 'highlight' : ''}">${pNoGoal}%</td></tr>
              </table>

              <div class="section-title">⏱️ الشوط الأول / النهائي (M/F)</div>
              <table class="prob-table">
                <tr><td class="prob-name">1 / 1</td><td class="prob-val">${pMF11}%</td></tr>
                <tr><td class="prob-name">X / 1</td><td class="prob-val">${pMFX1}%</td></tr>
                <tr><td class="prob-name">X / X</td><td class="prob-val">${pMFXX}%</td></tr>
                <tr><td class="prob-name">2 / 2</td><td class="prob-val">${pMF22}%</td></tr>
              </table>

              <div class="section-title">📌 النتيجة الدقيقة (Score Exacte)</div>
              <table class="prob-table">
                <tr><td class="prob-name">2 - 1</td><td class="prob-val highlight">${s21}%</td></tr>
                <tr><td class="prob-name">1 - 0</td><td class="prob-val">${s10}%</td></tr>
                <tr><td class="prob-name">1 - 1</td><td class="prob-val">${s11}%</td></tr>
                <tr><td class="prob-name">0 - 1</td><td class="prob-val">${s01}%</td></tr>
                <tr><td class="prob-name">نتائج أخرى</td><td class="prob-val">${sOther}%</td></tr>
              </table>
            </div>
          `;
        });

        html += `</div></div>`;
      }

      resultBox.innerHTML = html;

    } catch (error) {
      loading.style.display = "none";
      resultBox.innerHTML = `<p style="text-align:center; color:#ef4444; padding:15px;">❌ خطأ ف الاتصال: ${error.message}</p>`;
    }
  }
</script>
</body>
</html>
