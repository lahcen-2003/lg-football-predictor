<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lahcen Pro Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: #0b0f19; color: #f3f4f6; padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    
    #login-box {
      background: #111827; border: 1px solid #1f2937; padding: 25px; border-radius: 16px;
      text-align: center; margin-top: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #login-box h2 { color: #f59e0b; font-size: 20px; margin-bottom: 8px; }
    #login-box input {
      width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #374151;
      background: #1f2937; color: #fff; text-align: center; font-size: 16px; outline: none;
    }
    #login-box button {
      width: 100%; padding: 12px; border-radius: 8px; border: none; background: #f59e0b;
      color: #111827; font-size: 16px; font-weight: bold; cursor: pointer;
    }

    #dashboard { display: none; }
    .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
    .header h1 { color: #f59e0b; font-size: 18px; font-weight: 800; }
    .header p { color: #9ca3af; font-size: 12px; }

    .match-card {
      background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 12px;
      margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .match-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: #9ca3af; border-bottom: 1px solid #1f2937; padding-bottom: 6px; margin-bottom: 10px;
    }
    .league-name { font-weight: 700; color: #38bdf8; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .match-time { background: #1f2937; padding: 2px 8px; border-radius: 10px; color: #f59e0b; font-weight: 600; }

    .teams-container { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
    .team { width: 40%; text-align: center; font-weight: 700; font-size: 13px; }
    .vs { width: 20%; text-align: center; font-size: 11px; color: #6b7280; font-weight: bold; }
    .live-score { font-size: 15px; color: #10b981; font-weight: 800; }

    .pred-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      background: #0b0f19; border-radius: 10px; padding: 8px; margin-top: 10px; border: 1px solid #1f2937;
    }
    .pred-item { background: #1f2937; border-radius: 6px; padding: 6px; text-align: center; }
    .pred-label { font-size: 10px; color: #9ca3af; display: block; margin-bottom: 2px; }
    .pred-value { font-size: 11px; font-weight: 800; color: #38bdf8; }
    .highlight { color: #f59e0b; }
    .error-msg { color: #ef4444; font-size: 12px; display: none; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">

  <div id="login-box">
    <h2>👑 LAHCEN VIP ANALYTICS</h2>
    <p style="color:#9ca3af; font-size:12px;">أدخل اسم المستكشف المصرح له</p>
    <input type="text" id="username" placeholder="Lahcen">
    <button onclick="login()">دخول المنصة</button>
    <div id="login-error" class="error-msg">الاسم غير مصرح له!</div>
  </div>

  <div id="dashboard">
    <div class="header">
      <h1>📊 منصة التوقعات المتكاملة</h1>
      <p>مرحباً Lahcen | تحليل المباريات، النتيجة الدقيقة، و 1X2</p>
    </div>
    <div id="matches-list">جاري جلب البيانات والتحليل...</div>
  </div>

</div>

<script>
  const apiKey = "ac97973bec2a138f57e9449c8712fed3"; 

  function login() {
    const input = document.getElementById("username").value.trim();
    if (input.toLowerCase() === "lahcen") {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      fetchMatches();
    } else {
      document.getElementById("login-error").style.display = "block";
    }
  }

  function fetchMatches() {
    const today = new Date().toISOString().split('T')[0];

    fetch(`https://v3.football.api-sports.io/fixtures?date=${today}`, {
      method: "GET",
      headers: { "x-apisports-key": apiKey }
    })
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("matches-list");
      container.innerHTML = "";
      
      const matches = data.response ? data.response.slice(0, 20) : [];
      if(!matches || matches.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>لا توجد مباريات متاحة اليوم.</p>";
        return;
      }

      matches.forEach(m => {
        const matchDateObj = new Date(m.fixture.date);
        const timeStr = matchDateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStr = matchDateObj.toLocaleDateString([], { month: 'numeric', day: 'numeric' });

        const hId = m.teams.home.id || 1;
        const aId = m.teams.away.id || 1;
        const seed = (hId * 3 + aId * 7) % 100;

        let res1X2 = seed < 45 ? "1 (فوز البيتي)" : (seed < 70 ? "X (تعادل)" : "2 (فوز الضيف)");
        let exactScore = seed < 30 ? "2 - 1" : (seed < 50 ? "1 - 1" : (seed < 75 ? "1 - 0" : "0 - 2"));
        let btts = (seed % 2 === 0) ? "Goal (GG)" : "No Goal (NG)";
        let overUnder = seed > 40 ? "Plus 2.5" : "Moins 2.5";
        let htFt = seed < 35 ? "1 / 1" : (seed < 60 ? "X / 1" : "X / X");
        let confidence = 68 + (seed % 23);

        container.innerHTML += `
          <div class="match-card">
            <div class="match-header">
              <span class="league-name">🏆 ${m.league.name}</span>
              <span class="match-time">📅 ${dateStr} | ⏰ ${timeStr}</span>
            </div>
            <div class="teams-container">
              <div class="team">${m.teams.home.name}</div>
              <div class="vs">
                ${m.fixture.status.short === 'NS' 
                  ? 'VS' 
                  : `<span class="live-score">${m.goals.home ?? 0} - ${m.goals.away ?? 0}</span>`
                }
              </div>
              <div class="team">${m.teams.away.name}</div>
            </div>
            <div class="pred-grid">
              <div class="pred-item"><span class="pred-label">Résultat 1X2</span><span class="pred-value highlight">${res1X2}</span></div>
              <div class="pred-item"><span class="pred-label">Score Exacte</span><span class="pred-value">${exactScore}</span></div>
              <div class="pred-item"><span class="pred-label">Goal / NG</span><span class="pred-value">${btts}</span></div>
              <div class="pred-item"><span class="pred-label">Moins/Plus</span><span class="pred-value">${overUnder}</span></div>
              <div class="pred-item"><span class="pred-label">M/F (HT/FT)</span><span class="pred-value">${htFt}</span></div>
              <div class="pred-item"><span class="pred-label">النجاح</span><span class="pred-value highlight">${confidence}%</span></div>
            </div>
          </div>
        `;
      });
    })
    .catch(() => {
      document.getElementById("matches-list").innerHTML = "<p style='text-align:center; color:#ef4444;'>حدث خطأ أثناء جلب البيانات.</p>";
    });
  }
</script>

</body>
</html>
